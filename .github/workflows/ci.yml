name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Les JSON du frontend sont à jour
        run: |
          python -m engine export
          git diff --exit-code -- ../frontend/public/data/ || (echo "::error::frontend/public/data/ n'est pas à jour : lancer 'make build'" && exit 1)

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
